    zotero: ZS6BQM3P
  - referencia: "Iiro Kajanto, «Poggio Bracciolini's \"De Infelicitate Principum\" and Its Classical Sources», International Journal of the Classical Tradition 1, 1 (1994), 23-35."
    zotero: 2F37XBR7
