id: valla-de-voluptate
titulo: De voluptate
titulo_completo: De voluptate / De vero bono / De vero falsoque bono
lengua: latín
forma: diálogo
libros: 3

autores: [valla]

destinatarios: []
nota_destinatarios: "Por verificar en cada redacción."

# Interlocutores de la primera redacción (1431). Las siguientes cambian el reparto.
interlocutores:
  - persona: bruni
    nota: "Portavoz de la postura estoica."
  - persona: panormita
    nota: "Portavoz de la postura epicúrea."
  - persona: niccoli
    nota: "Portavoz de la síntesis cristiana."

composicion:
  fecha:
    desde: 1431
    hasta: 1449
    certeza: probable
    nota: "Primera redacción en 1431; revisiones hasta c. 1449."
  lugares:
    - lugar: roma
      nota: "Primera redacción. Por verificar (¿Roma o Piacenza?)."
    - lugar: pavia
      nota: "Segunda redacción."

redacciones:
  - titulo: De voluptate
    fecha: { desde: 1431, hasta: 1431, certeza: probable }
    lugares: [roma]
    interlocutores: [bruni, panormita, niccoli]
    ambientacion: roma
  - titulo: De vero bono
    fecha: { desde: 1433, hasta: 1433, certeza: probable }
    lugares: [pavia]
    interlocutores: [catone-sacco, maffeo-vegio, antonio-da-rho]
    ambientacion: pavia
    nota: "Nuevo reparto: interlocutores lombardos, por verificar."
  - titulo: De vero falsoque bono
    fecha: { desde: 1441, hasta: 1449, certeza: conjetural }
    lugares: []
    nota: "Revisiones posteriores; fechas y lugares por verificar."

ambientacion:
  fecha: null
  lugar: roma
  nota: "Según la primera redacción."

temas: [voluptas, honestas, estoicismo, epicureísmo, sumo bien]

resumen: >
  Debate sobre el sumo bien en el que la defensa epicúrea del placer derrota a
  la estoica, y ambas quedan superadas por la voluptas cristiana.

fuentes:
  - "Maristella de Panizza Lorch (ed.), De vero falsoque bono (1970)."
  - "David Marsh, The Quattrocento Dialogue (1980)."

revision: pendiente
