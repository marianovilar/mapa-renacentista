id: poggio-de-avaritia
titulo: De avaritia
titulo_completo: Historia convivalis disceptativa de avaritia et luxuria, et de fratre Bernardino aliisque concionatoribus
lengua: latín
forma: convivium
modo: diegético
denominacion: dialogus
libros: 1

autores: [poggio]

destinatarios:
  - persona: barbaro
    forma: dedicatoria
    nota: "El 13 de noviembre de 1428 Poggio anuncia a la vez que terminó la obra y que la dedica a Barbaro (Walser, según Lang 1973)."

interlocutores:
  - persona: bartolomeo-montepulciano
    nota: "Anfitrión: la conversación transcurre en su jardín. Propone discutir los dos peores vicios, la luxuria y la avaritia, que los predicadores tratan con superficialidad; pronuncia la primera invectiva contra la avaricia, con la etimología de avarus y la comparación con las harpías de Virgilio."
  - persona: loschi
    nombre_en_el_texto: Antonius
    nota: "Defiende la avaricia como natural y necesaria para la república: sin excedentes no habría caridad, liberalidad, templos ni artes. Poggio le dio ese papel porque era casi pródigo («fere prodigus»)."
  - persona: cencio-rustici
    nombre_en_el_texto: Cincius
    nota: "Retoma la avaricia del clero y la vincula con Judas, hasta que Andrea lo interrumpe. Según la carta a Niccoli, Poggio le había dado el papel principal contra la avaricia porque tenía fama de avaro."
  - persona: andrea-constantinopla
    nota: "Llega cuando los demás ya acordaron el orden de los discursos. Refuta a Loschi punto por punto y, según Walser, expresa la opinión del propio Poggio."
nota_interlocutores: "Bruni y Niccoli objetaron el uso de nombres modernos y de personas reales. En la carta a Niccoli de junio de 1429 Poggio dice haber dado a Cencio el papel principal contra la avaricia, pero en el texto impreso la invectiva inicial es de Bartolomeo. Lang (1973) no comenta la diferencia, pero Shepherd (1837) la explica: en el primer borrador la invectiva inicial era de Cencio, y Poggio la pasó a Bartolomeo da Montepulciano porque Cencio tenía fama de avaro."

evocados:
  - persona: bernardino-siena
    nota: "La conversación pasa de los predicadores a Bernardino, que entonces predicaba en Roma. Loschi lo elogia; Bartolomeo responde que nunca predicó de verdad contra la avaricia, solo contra la usura. Ante Niccoli, Poggio sostuvo que no atacaba a Bernardino sino a los predicadores franciscanos."

composicion:
  fecha:
    desde: 1428
    hasta: 1428
    certeza: segura
    nota: "Terminada el 13 de noviembre de 1428. Por respeto a Martín V, de fama avara, Poggio le escribe a Niccoli en junio de 1429 que no la publicaría mientras viviera el papa; aun así, cuando este murió en 1431 ya circulaba hacía dos años entre sus amigos (Lang 1973). Shepherd (1837) sostiene que Poggio la dio a conocer públicamente recién después de la muerte del papa."
  lugares:
    - lugar: roma
      nota: "En la curia papal, donde Poggio era secretario."

ambientacion:
  espacio: jardín
  fecha:
    desde: 1427
    hasta: 1427
    certeza: probable
    nota: "Durante la predicación triunfal de Bernardino de Siena en Roma, tras ser absuelto de las acusaciones por las que había comparecido ante el papa."
  lugar: roma
  nota: "Sobremesa al aire libre en el jardín de Bartolomeo da Montepulciano, entre secretarios apostólicos que no tienen en ese momento obligaciones con el papa."

temas: [avaritia, luxuria, usura, predicadores y órdenes mendicantes, Bernardino de Siena, utilidad pública, curia]

resumen: >
  Tras una comida en el jardín de Bartolomeo da Montepulciano, unos
  secretarios de la curia pasan de criticar a los predicadores a discutir la
  avaricia. Bartolomeo la condena, Loschi la defiende como fundamento de la
  ciudad y Andrea de Constantinopla lo refuta. Lang lo lee como una temprana
  articulación de los valores de la élite mercantil florentina.

