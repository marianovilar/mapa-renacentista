    certeza: probable
    nota: "Septiembre de 1450, según las suscripciones. El verano del año jubilar, primero de Cusa como cardenal (recibió el capelo el 11 de enero de 1450), que fue para él «un año de descanso y reflexión»: como el papa, salió de Roma y en esos meses escribió los cuatro libros del Idiota (De sapientia I y II, De mente, De staticis experimentis), que van de la teología a la epistemología y a la filosofía natural (Meuthen)."
