  lugar: roma

temas: [balanza, experimentación, medida, filosofía natural, medicina]

resumen: >
  Cuarto libro del Idiota: el laico propone medir con la balanza el peso
  específico de la sangre y la orina, el pulso, la respiración o la humedad.
  Según Meuthen, marca el paso de la investigación de cualidades a la medición
  de cantidades, de la filosofía natural medieval a la ciencia moderna.

fuentes:
  - "Erich Meuthen, Nicholas of Cusa: A Sketch for a Biography, trad. David Crowner y Gerald Christianson, Washington, The Catholic University of America Press, 2010 [Nikolaus von Kues: Skizze einer Biographie, 1964; 7.ª ed., 1992]."

