    desde: 1467
    hasta: 1471
    certeza: conjetural
    nota: "Revisado hasta su publicación."
  lugares:
    - lugar: napoles

ambientacion:
  espacio: más allá
  fecha: null
  lugar: null
  nota: "A orillas del Aqueronte, en un lugar de paso parecido a un locus amoenus. Las escenas transcurren a la vez en las dos orillas, unidas por los viajes de Caronte (Corfiati)."

primera_edicion:
  fecha:
    desde: 1491
    hasta: 1491
    certeza: segura
    nota: "31 de enero de 1491, junto con el Antonius (Del Noce 2018)."
  lugar: napoles
  impresor: Mattia Moravo

relaciones:
