id: pontano-charon
titulo: Charon
lengua: latín
forma: diálogo
modo: mimético
libros: 1

autores: [pontano]

destinatarios: []

interlocutores:
  - persona: caronte
  - persona: mercurio
  - persona: minos
  - persona: eaco
  - persona: diogenes
    nota: "Breve intercambio con Caronte."
  - persona: crates
    nota: "Breve intercambio con Caronte."
nota_interlocutores: "Corfiati cuenta dieciséis personajes con voz, sin el coro final de almas. Los cuatro principales son Éaco y Minos (los dos jueces, que preguntan) y Mercurio y Caronte. Mercurio funciona como maestro u oráculo; Caronte, como el que interrumpe y pregunta. Entre las comparsas están Piricalco, tres gramáticos y almas sin nombre."

composicion:
  fecha:
    desde: 1467
    hasta: 1471
    certeza: conjetural
    nota: "Revisado hasta su publicación."
  lugares:
    - lugar: napoles

ambientacion:
  espacio: más allá
  fecha: null
  lugar: null
  nota: "A orillas del Aqueronte, en un lugar de paso parecido a un locus amoenus. Las escenas transcurren a la vez en las dos orillas, unidas por los viajes de Caronte (Corfiati)."

