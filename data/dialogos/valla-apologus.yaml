id: valla-apologus
titulo: Apologus in Poggium
titulo_completo: In Poggium Florentinum apologeticus et scenicus actus
lengua: latín
forma: diálogo
modo: mimético
libros: 1

autores: [valla]

destinatarios: []
nota_destinatarios: "Sin dedicatario conocido. Valla dice responder a las invectivas de Poggio no con otra invectiva sino con un «apólogo o acto escénico», para que resulte más divertido a los lectores (Bonmatí 2004). Por verificar."

interlocutores:
  - persona: guarino
    nota: "Hace de juez: Valla le pide que corrija en su lugar el latín de Poggio, y Guarino lo reprende continuamente comparándolo con el de sus criados. Interroga a los sirvientes sobre construcciones y diminutivos (Bonmatí 2004)."
  - persona: poggio
    nota: "Acusado de escribir en el latín vulgar o «culinario» de un cocinero o un caballerizo; se duerme ebrio y solo interviene al principio y al final (Bonmatí 2004)."
  - persona: valla
    nombre_en_el_texto: Laurentius
    nota: "Pone en escena la disputa y pide a Guarino que juzgue. Los errores que atribuye a Poggio están tomados, de forma ficticia, de sus cartas a Niccolò Niccoli."
  - persona: parmeno
    nota: "El cocinero, que habla latín culinario; pide que Poggio, que habla peor que él, lo reemplace en la cocina o como despensero."
  - persona: dromo
    nota: "El caballerizo, que habla latín culinario."
  - persona: dionisio-apologus
    nombre_en_el_texto: Dionysius
    nota: "Despensero o vinatero, alumno de Guarino: explica correctamente el régimen de los verbos incoativos (Elegantiae I, 23)."
nota_interlocutores: "Los nombres de los criados vienen de la comedia: Dromo y Parmeno, de Plauto y Terencio; Dionisio, de una carta de Cicerón (Att. 4, 8, 2). Dan al diálogo un tono festivo (Bonmatí 2004)."

evocados:
  - persona: niccoli
    nota: "Destinatario de las cartas de Poggio de las que Valla extrae, de forma ficticia, los errores de latín que le reprocha."

composicion:
  fecha:
    desde: 1453
    hasta: 1454
    certeza: probable
    nota: "Hacia 1454 (Bonmatí), como respuesta inmediata a la Cuarta invectiva de Poggio, difundida hacia 1453; la polémica entre ambos se aviva entre 1451 y 1454. El llamado Apólogo II, que contesta a la Disceptatio convivalis III de Poggio (1450), es anterior: su número se debe al orden de las ediciones. Poggio respondió al Apólogo en su Quinta invectiva."
  lugares:
    - lugar: roma
      nota: "Valla vivía en Roma desde 1448, al servicio de Nicolás V. Por verificar."

ambientacion:
  espacio: casa privada
  fecha: null
  lugar: null
  nota: "Bonmatí sitúa la escena en casa de Guarino y, a la vez, en la cocina de Valla, donde los criados hablan su latín de cocina. Por verificar en el texto."

temas: [lengua latina, sermo vulgaris, latín culinario, Elegantiae, polémica con Poggio, comedia, invectiva]

resumen: >
  Respuesta escénica de Valla a las invectivas de Poggio: con Guarino como
  juez, los criados de la casa, el cocinero, el caballerizo y el despensero,
  exhiben su latín «culinario», que Valla equipara al de Poggio. Mientras
  Poggio dormita borracho, Guarino corrige uno a uno sus barbarismos según
  la autoridad de los antiguos, defendiendo la Romana lingua de las
  Elegantiae frente al sermo vulgaris.

