id: pontano-aegidius
titulo: Aegidius
titulo_completo: Aegidius multiplicis argumenti
lengua: latín
forma: diálogo
modo: mimético
libros: 1

autores: [pontano]

destinatarios:
  - persona: egidio-viterbo
    forma: dedicatoria
    nota: "La obra lleva su nombre; la dedicatoria impresa es de Summonte (1507). El diálogo responde a la carta de Egidio del 3 de noviembre de 1500 (Cantore)."

# Reparto según Cantore (2018) y Vilar (2022). Salvo los dos viajeros,
# todos son miembros de la academia napolitana.
interlocutores:
  - persona: suardo
    nota: "Viajero que vuelve de Roma con Peto; abre el diálogo y lo cierra con una nota de esperanza sobre la filosofía latina."
  - persona: peto
    nota: "Viajero que vuelve de Roma con Suardo."
  - persona: pontano
    nombre_en_el_texto: Pontanus
    nota: "Recibe a los viajeros en el pórtico; consuela por la muerte de Mariano da Genazzano y defiende la inmortalidad del alma."
  - persona: cariteo
    nota: "Se declara convertido a Hermes Trismegisto; habla del verbum creador y redentor."
  - persona: tristano-caracciolo
  - persona: francesco-poderico
  - persona: pardo
    nota: "Habla sobre privatio y carentia y sobre la astrología frente al libre albedrío. Cantore lo ve como posible sucesor de Pontano al frente de la academia."
  - persona: summonte
    nota: "Recita un poema atribuido a Sannazaro, quizás de Pontano (Tateo)."
  - persona: tamira
    nota: "Narra, con Pucci, la aparición de Altilio a un monje de Montecassino."
  - persona: carbone
    nota: "Propone discutir el comienzo de las Geórgicas."
  - persona: pucci
    nota: "Narra, con Tamira, la aparición de Altilio."
  - persona: tomacelli
    nota: "Propone vincular el paraíso cristiano con los Campos Elíseos."
  - persona: elio-marchese
nota_interlocutores: "Aparece además, en un relato referido, un monje de Montecassino ante quien se presenta el espíritu de Altilio."

evocados:
  - persona: egidio-viterbo
    nota: "No habla: está presente por dos sermones que abren y cierran el diálogo en simetría; se lo saluda como «nuestro ausente Egidio» (Cantore, Vilar)."
  - persona: mariano-genazzano
    nota: "Su muerte reciente abre el diálogo; desde el cielo inspira a Egidio, su sucesor."
  - persona: altilio
    nota: "Muerto en 1501; su espíritu se aparece para pedir que las Musas se vuelvan a Cristo."
  - persona: sannazaro
    nota: "Ausente: sigue al rey Federico a su exilio en Francia."
  - persona: golino
    nota: "Recordado entre los amigos muertos."
  - persona: calenzio
    nota: "Recordado entre los amigos muertos."

relaciones:
  - dialogo: pontano-actius
    tipo: serie
    nota: "Publicados juntos por Summonte en 1507."
  - dialogo: pontano-asinus
    tipo: serie
    nota: "Publicados juntos por Summonte en 1507."

composicion:
  fecha:
    desde: 1501
    hasta: 1501
    certeza: probable
    nota: "Compuesto en 1501, dos años antes de la muerte de Pontano (17 de septiembre de 1503), según la cronología de Salvatore Monti que siguen Cantore y Vilar."
  lugares:
    - lugar: napoles

ambientacion:
  espacio: academia
  fecha:
    desde: 1501
    hasta: 1501
    certeza: probable
    nota: "Después de la muerte de Altilio y de la partida de Sannazaro con el rey Federico a Francia (1501)."
  lugar: napoles
  nota: "En el pórtico de la casa de Pontano, donde se reunía la academia; los viajeros leen la inscripción de la fachada (hoy en la capilla Pontano, via dei Tribunali)."

primera_edicion:
  fecha:
    desde: 1507
    hasta: 1507
    certeza: segura
    nota: "Edición póstuma a cargo de Pietro Summonte, junto con el Actius y el Asinus; el subtítulo «multiplicis argumenti» es de Summonte."
  lugar: napoles
  impresor: Sigismund Mayr
  nota: "Impresor por verificar."

temas: [unión de sapiencia y elocuencia, Musas cristianas, inmortalidad del alma, astrología y libre albedrío, léxico filosófico latino, muerte y sucesión, Hermes Trismegisto]

resumen: >
  Testamento espiritual de Pontano. Los académicos, reunidos en su pórtico,
  pasan de un tema a otro sin disputa in utramque partem: la muerte de los
  amigos, la inmortalidad del alma, la astrología y la necesidad de que la
  filosofía vuelva a hablar un latín elegante.

fuentes:
