temas: [retórica y filosofía, res et verba, creación por la palabra, léxico filosófico latino, piedad religiosa, duelo por Golino]

resumen: >
  Diálogo de vejez en el que la sabiduría de Pontano aparece unida a la piedad
  religiosa. Defiende la unión de elocuencia y saber y critica el latín de los
  traductores de Aristóteles (privatio y carentia, las circumstantiae).

fuentes:
  - "Mariano Vilar, «Los saberes del humanismo en diálogo: introducción al Aegidius de Giovanni Pontano», Circe de clásicos y modernos 26, 1 (2022), 135–148."
  - "Mariano Vilar, «El Asinus de Giovanni Pontano: un autoelogio paródico», Scripta Mediaevalia 17, 1 (2024), 49–70."
  - "Rainer Weiss, «The Humanist Rediscovery of Rhetoric as Philosophy: Giovanni Gioviano Pontano's Aegidius», trad. Y. Mundy, Philosophy & Rhetoric 13, 1 (1980), 25–42."
  - "Claudia Corfiati, «Il sistema dei personaggi nei Dialoghi del Pontano», en Acta Conventus Neo-Latini Vindobonensis, Leiden, Brill, 2018, 216–225."
  - "Giovanni Pontano, Aegidius: Dialogo, ed. Francesco Tateo, Roma, 2013."

