id: poggio-de-varietate-fortunae
titulo: De varietate fortunae
lengua: latín
forma: mixta
libros: 4

caso_dudoso: true
motivo_duda: "El marco dialogado con Loschi domina el libro I; el resto es sobre todo historia y relato de viajes (Niccolò de' Conti en el libro IV)."

autores: [poggio]

destinatarios:
  - persona: nicolas-v
    forma: dedicatoria
    nota: "La dedicatoria elogia la utilidad moral de la historia, presenta la obra como afín al De infelicitate principum dedicado antes al mismo Tommaso, y le recuerda que como soberano temporal el papa no escapa a la fortuna (Shepherd 1837)."

interlocutores:
  - persona: poggio
    nota: "El autor como personaje."
  - persona: loschi

composicion:
  fecha:
    desde: 1431
    hasta: 1448
    certeza: probable
    nota: "Comenzado hacia 1431; terminado y dedicado a Nicolás V tras su elección (marzo de 1447). Shepherd (1837) fecha la publicación en 1447. El libro IV recoge el relato que Poggio obtuvo de Niccolò de' Conti cuando este acudió a Eugenio IV para que lo absolviera de haber abjurado de la fe."
  lugares:
    - lugar: roma

ambientacion:
  espacio: espacio urbano
  fecha:
    desde: 1430
    hasta: 1431
    certeza: probable
    nota: "Poco antes de la muerte de Martín V (febrero de 1431)."
  lugar: roma
  nota: "Poggio y Loschi, cansados de recorrer los restos de la Roma antigua, descansan sentados en la roca Tarpeya, entre las ruinas del Capitolio, desde donde se domina casi toda la ciudad, que «yace como un inmenso cadáver» (Ciordia 2017). Loschi evoca a Mario sentado entre las ruinas de Cartago."

temas: [fortuna, ruinas de Roma, historia contemporánea, Tamerlán y Bayezid, viajes a la India]

resumen: >
  Desde el Capitolio, Poggio y Loschi recorren con la mirada las ruinas de Roma
  y discuten qué es la fortuna. Siguen ejemplos antiguos y modernos de sus
  reveses, la historia de Italia desde 1377 hasta Eugenio IV y, en el libro IV,
  el viaje de Niccolò de' Conti por Persia y la India.

fuentes:
  - "Martín José Ciordia, «El príncipe y el sabio en el De infelicitate principum de Poggio Bracciolini», Studia Aurea 11 (2017), 461–479."
  - "William Shepherd, The Life of Poggio Bracciolini, 2.ª ed., Liverpool, 1837, cap. X."

ediciones:
  - tipo: edición
    lengua: latín
    referencia: "Poggio Bracciolini, De varietate fortunae, ed. Outi Merisalo, Helsinki, Suomalainen Tiedeakatemia, 1993."
    anio: 1993
    nota: "Edición crítica citada por Ciordia (2017)."
    verificado: false
  - tipo: edición y traducción
    lengua: francés
    referencia: "Gian Francesco Poggio Bracciolini, Les ruines de rome: de varietate fortunae (livre I), ed. XXX, Paris, Les Belles Lettres, 1999."
    anio: 1999
    zotero: TPZKM4Z6
    nota: "Solo el libro I."
  - tipo: traducción
    lengua: inglés
    referencia: "Gianfrancesco Poggio Bracciolini y Ludovico de Varthema, Travelers in disguise: narratives of Eastern travel, trad. Lincoln Davis Hammond, Cambridge, Distributed for the Dept. of Romance Languages and Literatures of Harvard University by Harvard University Press, 1963."
    anio: 1963
    zotero: KBQFFW2E
    nota: "Solo el libro IV (el viaje de Niccolò de' Conti)."

bibliografia:
