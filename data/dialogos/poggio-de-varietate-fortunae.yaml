    zotero: BJEI7B8M
  - referencia: "Iiro Kajanto, Poggio Bracciolini and classicism: a study in early Italian humanism, Helsinki, Suomalainen Tiedeakatemia: Distributor, Akateeminen Kirjakauppa, 1987."
