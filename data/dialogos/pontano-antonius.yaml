  - "Gianluca Del Noce, «Identità accademica e ‘incursioni’ dell’autore nel dialogo ‘Antonius’ di Giovanni Pontano», en La letteratura italiana e le arti. Atti del XX Congresso dell’ADI, Roma, Adi editore, 2018."
  - "Giovanni Pontano, I Dialoghi, ed. C. Previtera, Firenze, Sansoni, 1943."
  - "Giovanni Gioviano Pontano, Dialogues I: Charon and Antonius, ed. y trad. J. H. Gaisser, Cambridge (MA), Harvard University Press, 2012."
  - "Salvatore Monti, «Ricerche sulla cronologia dei Dialoghi», en L. Monti Sabia y S. Monti, Studi su Giovanni Pontano, Messina, 2010, II, 757–834."

