id: pontano-antonius
titulo: Antonius
lengua: latín
forma: mixta
modo: mimético
libros: 1

autores: [pontano]

destinatarios: []
nota_destinatarios: "Sin dedicatario. El título rinde homenaje al Panormita, fundador de la academia, muerto poco antes del tiempo de la acción y protagonista in absentia."

# Del Noce distingue cuatro secciones en prosa, con repartos distintos,
# más una parte prosimétrica y otra enteramente en verso.
interlocutores:
  - persona: golino
    nombre_en_el_texto: Compater
    nota: "Secciones 1 y 3. De luto por el Panormita; pronuncia su elogio."
  - persona: huesped-siciliano
    nombre_en_el_texto: Hospes Siculus
    nota: "Sección 1. Forastero que busca al Panormita y su pórtico."
  - persona: puderico
    nota: "Sección 1. «Civitas nostra tota delirium est»."
  - persona: contrario
    nota: "Sección 2. Defiende a Cicerón contra los gramáticos."
  - persona: calenzio
    nombre_en_el_texto: Elisius
    nota: "Sección 2. Defiende a Virgilio contra los gramáticos."
  - persona: suppazio
    nota: "Sección 3. Relata su viaje por Italia en busca del verdadero sabio."
  - persona: lucio-pontano
    nota: "Sección 4. El hijo pequeño de Pontano, que huye de una escena de celos de su madre."
  - persona: lyricen
    nota: "Parte prosimétrica. Alter ego de Pontano."
  - persona: poeta-personatus
    nota: "Parte en verso. Canta el Bellum Sertoriacum (630 hexámetros)."
  - persona: histrio-personatus
    nota: "Parte en verso. Prólogo e intermedio en yambos plautinos."
nota_interlocutores: "Corfiati cuenta catorce personajes con voz. Además de los registrados aparecen máscaras de paso: el Peregrinus, el Praeco (pregonero), un puer y un senex, y la misteriosa Euforbia. Según Corfiati, Compater y Puderico repiten el papel de Éaco y Minos en el Charon (viejos funcionarios que preguntan), y Contrario y Calenzio el de los maestros. En el Bellum Sertoriacum figuran también, heroizados, Marullo, Pardo, el Cariteo, Altilio y Sannazaro."

evocados:
  - persona: panormita
    nota: "Protagonista in absentia: el diálogo lleva su nombre y transcurre poco después de su muerte."
  - persona: pontano
    nota: "Ausente por una pierna rota; aparece bajo máscaras (el Lyricen, Pontius en el Bellum Sertoriacum)."

composicion:
  fecha:
    desde: 1482
    hasta: 1490
    certeza: probable
    nota: "Entre 1482–1483 y 1490, según la cronología de S. Monti."
  lugares:
    - lugar: napoles

ambientacion:
  espacio: academia
  fecha:
    desde: 1471
    hasta: 1471
    certeza: probable
    nota: "Poco después de la muerte del Panormita (19 de enero de 1471)."
  lugar: napoles
  nota: "En un cruce de calles (la actual via dei Tribunali) entre la Porticus Antoniana, sede de la academia, y la casa de Pontano."

primera_edicion:
  fecha:
    desde: 1491
    hasta: 1491
    certeza: segura
    nota: "31 de enero de 1491, junto con el Charon."
  lugar: napoles
  impresor: Mattia Moravo

relaciones:
  - dialogo: pontano-charon
    tipo: serie
    nota: "Publicados juntos en 1491 por voluntad del autor."

temas: [academia napolitana, homenaje al Panormita, gramáticos, defensa de Virgilio y Cicerón, Bellum Sertoriacum]

resumen: >
  Los académicos napolitanos, reunidos junto al pórtico del difunto Panormita,
  critican las costumbres de Nápoles, defienden a Cicerón y a Virgilio de los
  gramáticos y escuchan cantos que culminan en un poema épico sobre Sertorio.

