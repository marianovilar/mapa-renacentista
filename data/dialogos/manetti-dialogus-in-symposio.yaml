id: manetti-dialogus-in-symposio
titulo: Dialogus in symposio
titulo_completo: Dialogus in domestico et familiari quorundam amicorum symposio Venetiis habitus cum ibi Florentini populi nomine legationis munere fungeretur
lengua: latín
forma: convivium
denominacion: dialogus
libros: 1

autores: [manetti]

destinatarios:
  - persona: donato-acciaiuoli
    forma: dedicatoria
    nota: "Tenía diecinueve años; primo de Agnolo Acciaiuoli. El ejemplar de dedicatoria (Florencia, Riccardiana 696), copiado en Venecia por Griso Griselli, lleva su marca de propiedad."

interlocutores:
  - persona: manetti
    nota: "Anfitrión: como embajador florentino ofrece el banquete; propone a los árbitros."
  - persona: bernardo-manetti
    nota: "Hijo del autor; narra las dos novelas que abren la primera disputa (Tancredi y Ghismonda, Seleuco y Antíoco), ambas en las versiones de Bruni."
  - persona: sinibaldo-donati
    nota: "Propone la segunda cuestión, cuál es el animal más útil al hombre, y defiende al caballo."
  - persona: alessandro-martelli
    nota: "Defiende a las abejas, con las Geórgicas."
  - persona: tommaso-ringadori
    nota: "Defiende al buey."
  - persona: nerozzo-del-nero
    nota: "Defiende a la oveja."
  - persona: griso-griselli
    nota: "Defiende a la gallina."
  - persona: giovanfrancesco-manetti
  - persona: pigello-portinari
  - persona: carlo-bardi
  - persona: gabriele-belli
    nota: "Designado árbitro, cede el papel a Rondinelli."
  - persona: michele-rondinelli
    nota: "Árbitro: da el premio al buey y, desde el cristianismo, no aprueba ni a Tancredi (homicidio) ni a Antíoco (incesto)."
nota_interlocutores: "En la primera disputa cinco comensales elogian el rigor de Tancredi y cinco la indulgencia de Seleuco. Al final se suman jóvenes florentinos que bailan y cantan canciones francesas y venecianas. Reviakina (1980) da los nombres deformados por la traducción («Hirsus», «Pigelius, Partinarius»)."

evocados:
  - persona: bruni
    nota: "Mentor de Manetti: modelo del diálogo ciceroniano (Dialogi ad Petrum Histrum) y autor de las dos novelas de 1436."
  - persona: boccaccio
    nota: "Autor de la novela de Tancredi (Decameron IV, 1); el final con música y danza también imita al Decameron."

composicion:
  fecha:
    desde: 1448
    hasta: 1449
    certeza: segura
    nota: "Entre el banquete (8 de octubre de 1448) y la copia de dedicatoria, hecha probablemente a comienzos de 1449."
  lugares:
    - lugar: venecia

ambientacion:
  espacio: casa privada
  fecha:
    desde: 1448
    hasta: 1448
    certeza: segura
    nota: "8 de octubre de 1448, fiesta anual de la consagración de la basílica de San Marcos (no la del santo, como entiende Reviakina). Es tiempo de peste."
  lugar: venecia
  nota: "Banquete ofrecido por el embajador Manetti a sus invitados, en su mayoría florentinos residentes en Venecia, partidarios y enemigos de los Medici."

primera_edicion: null
nota_edicion: "Inédito según Reviakina (1980). Manuscritos: Florencia, Riccardiana 696 (ejemplar de dedicatoria) y Laurenziana, Plut. XC sup. 29, ff. 1r–43v."

temas: [peste, Tancredi y Ghismonda, Seleuco y Antíoco, autoridad paterna, crueldad y humanidad, ley natural, el animal más útil al hombre, Saturnales de Macrobio]

resumen: >
  En un banquete en Venecia, los invitados de Manetti debaten primero si merece
  más elogio el severo Tancredi o el indulgente Seleuco, y luego cuál es el
  animal más útil al hombre. El diálogo combina la disputa ciceroniana con el
  symposium erudito de Macrobio y termina con música y danza.

fuentes:
  - "David Marsh, Giannozzo Manetti: The Life of a Florentine Humanist, Cambridge (MA), Harvard University Press, 2019, cap. 4."
  - "N. V. Reviakina, «Giannozzo Manetti's Dialogue at a Feast of Friends», Soviet Studies in History 19, 2 (1980), 47–65 (orig. ruso, Saratov, 1978)."
  - "Nicola Badaloni, «Filosofia della mente e filosofia delle arti in Giannozzo Manetti», Critica storica (1963), 2, 414–415 n. 93."

revision: pendiente
