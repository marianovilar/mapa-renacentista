id: petrarca-secretum
titulo: Secretum
titulo_completo: De secreto conflictu curarum mearum
lengua: latín
forma: diálogo
modo: mimético
libros: 3

autores: [petrarca]

destinatarios: []
nota_destinatarios: "Sin dedicatario: el proemio se dirige al propio libro («tú, librito, huyendo de las reuniones de los hombres, te contentarás con quedarte conmigo»). Petrarca no lo hizo circular en vida (Celenza 2017)."

interlocutores:
  - persona: petrarca
    nombre_en_el_texto: Franciscus
    nota: "El autor como personaje: discípulo humilde, a veces obstinado, que reconoce sus males pero no logra cambiar."
  - persona: agustin
    nombre_en_el_texto: Augustinus
    nota: "Maestro y severo examinador, reconocido sin necesidad de preguntarle el nombre por «su aspecto africano unido a la elocuencia romana». A diferencia del Agustín histórico, que confiaba en la gracia, el personaje defiende el poder de la voluntad humana (Celenza 2017)."
  - persona: veritas
    nombre_en_el_texto: Veritas
    nota: "Presente y silenciosa: se le aparece a Petrarca absorto en sus pensamientos, como una mujer radiante con aspecto de virgen, y vigila la conversación como garante de su sinceridad."

composicion:
  fecha:
    desde: 1347
    hasta: 1353
    certeza: probable
    nota: "Primera redacción en 1347, revisiones en 1349 y 1353 (Rico). Celenza lo hace comenzar en 1347, poco después de la visita a su hermano Gherardo en la cartuja de Montrieux, y trabajado hasta 1353, el año del traslado definitivo a Italia. La datación tradicional era 1342–1343."
  lugares:
    - lugar: vaucluse
      nota: "Redacción de 1347."
    - lugar: milan
      nota: "Última revisión, hacia 1353. Por verificar."

ambientacion:
  espacio: visión
  fecha:
    desde: 1342
    hasta: 1343
    certeza: conjetural
    nota: "Fecha ficticia que la obra sugiere; no coincide con la de composición."
  lugar: null
  nota: "Escenario de visión, sin lugar concreto."

temas: [conversión, acedia, amor por Laura, gloria, examen de conciencia, voluntad y gracia, ejercicio espiritual]

resumen: >
  Durante tres días, Augustinus examina a Franciscus sobre sus pasiones
  (amor, gloria, acedia) ante la mirada silenciosa de la Verdad. El libro III
  pasa de Laura a la gloria y le ordena abandonar el De viris illustribus y el
  Africa («Dimitte Africam»). Celenza lo lee como un ejercicio espiritual
  escrito para sí mismo.

fuentes:
  - "Christopher S. Celenza, Petrarch: Everywhere a Wanderer, Londres, Reaktion Books, 2017."
  - "Francisco Rico, Vida u obra de Petrarca. I. Lectura del Secretum (1974)."

revision: pendiente
