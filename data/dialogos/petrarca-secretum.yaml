id: petrarca-secretum
titulo: Secretum
titulo_completo: De secreto conflictu curarum mearum
lengua: latín
forma: diálogo
libros: 3

autores: [petrarca]

destinatarios: []
nota_destinatarios: "Sin dedicatario: el proemio lo presenta como un libro privado, no destinado a circular."

interlocutores:
  - persona: petrarca
    nombre_en_el_texto: Franciscus
    nota: "El autor como personaje."
  - persona: agustin
    nombre_en_el_texto: Augustinus
  - persona: veritas
    nombre_en_el_texto: Veritas
    nota: "Presente y silenciosa: asiste al diálogo sin intervenir."

composicion:
  fecha:
    desde: 1347
    hasta: 1353
    certeza: probable
    nota: "Primera redacción en 1347, revisiones en 1349 y 1353 (Rico). La datación tradicional era 1342–1343."
  lugares:
    - lugar: vaucluse
      nota: "Redacción de 1347."
    - lugar: milan
      nota: "Última revisión, hacia 1353. Por verificar."

ambientacion:
  fecha:
    desde: 1342
    hasta: 1343
    certeza: conjetural
    nota: "Fecha ficticia que la obra sugiere; no coincide con la de composición."
  lugar: null
  nota: "Escenario de visión, sin lugar concreto."

temas: [conversión, acedia, amor por Laura, gloria, examen de conciencia]

resumen: >
  Durante tres días, Augustinus examina a Franciscus sobre sus pasiones
  (amor, gloria, acedia) ante la mirada silenciosa de la Verdad.

fuentes:
  - "Francisco Rico, Vida u obra de Petrarca. I. Lectura del Secretum (1974)."

revision: pendiente
